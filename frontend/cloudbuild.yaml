steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--tag'
      - 'us-central1-docker.pkg.dev/eduecosystem-prod/cloud-run-source-deploy/eduecosystem-frontend:latest'
      - '.'

images:
  - 'us-central1-docker.pkg.dev/eduecosystem-prod/cloud-run-source-deploy/eduecosystem-frontend:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
