version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduecosystem-backend
    restart: always
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./uploads:/app/uploads
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/eduecosystem
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - eduecosystem-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduecosystem-frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.production
    depends_on:
      - backend
    networks:
      - eduecosystem-network

  db:
    image: postgres:15-alpine
    container_name: eduecosystem-db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=eduecosystem
    networks:
      - eduecosystem-network

  redis:
    image: redis:7-alpine
    container_name: eduecosystem-redis
    restart: always
    networks:
      - eduecosystem-network

  nginx:
    image: nginx:alpine
    container_name: eduecosystem-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - eduecosystem-network

networks:
  eduecosystem-network:
    driver: bridge

volumes:
  postgres_data:
