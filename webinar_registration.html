<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live UPSC Strategy Webinar</title>
    <!-- Modern Web Design, dark mode, glassmorphism, dynamic animations -->
    <style>
        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --success: #10b981;
            --surface: rgba(30, 41, 59, 0.7);
        }
        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(239, 68, 68, 0.1) 0%, transparent 40%);
        }
        .container {
            max-width: 800px;
            width: 90%;
            padding: 3rem;
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            margin: 2rem 0;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.3;
        }
        .subtitle {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }
        .pricing-block {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .special-badge {
            display: inline-block;
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 0.5rem 1rem;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .price-display {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--text-main);
        }
        
        /* Form Section */
        .enroll-form {
            text-align: left;
            background: rgba(0, 0, 0, 0.2);
            padding: 2.5rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .form-group {
            margin-bottom: 1.8rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.75rem;
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 1rem 1.25rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
            font-size: 1.15rem;
            font-weight: 600;
            padding: 1.2rem 3rem;
            border-radius: 9999px;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
            width: 100%;
            margin-top: 1rem;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(59, 130, 246, 0.5);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Confirmation section */
        #confirmation-section {
            display: none;
        }
        .success-icon {
            font-size: 4rem;
            color: var(--success);
            margin-bottom: 1rem;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container" id="main-section">
        <div class="special-badge">Filling Fast</div>
        <h1>Live UPSC Strategy Webinar</h1>
        <div class="subtitle">1.5 hour live session. Real strategy. Real questions.<br>Tomorrow at 6 PM.</div>
        
        <div class="pricing-block">
            <div style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 0.5rem;">Webinar Access</div>
            <div class="price-display">₹99</div>
        </div>

        <form id="registration-form" class="enroll-form">
            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" class="form-control" required placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" required placeholder="Where should we send the meet link?">
            </div>
            <div class="form-group">
                <label for="whatsapp">WhatsApp Number</label>
                <input type="tel" id="whatsapp" class="form-control" required pattern="[0-9]{10}" placeholder="Enter 10-digit number" title="Please enter a valid 10-digit number">
            </div>
            
            <button type="submit" class="btn" id="submit-btn">Pay ₹99 & Register</button>
        </form>
    </div>

    <div class="container" id="confirmation-section">
        <div class="success-icon">✓</div>
        <h1>You're registered!</h1>
        <div class="subtitle">Check your email for the Meet link.</div>
        
        <div style="background: rgba(0,0,0,0.2); padding: 1.5rem; border-radius: 12px; margin-top: 2rem; border: 1px solid rgba(255,255,255,0.05); text-align: left;">
            <p style="margin: 0 0 1rem 0; color: var(--text-muted);">Registration Details</p>
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                <span>Name</span>
                <strong id="confirm-name" style="color: white;"></strong>
            </div>
            <div style="display: flex; justify-content: space-between;">
                <span>Status</span>
                <strong style="color: var(--success);">Confirmed</strong>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const paymentStatus = urlParams.get('payment_status');
            
            if (paymentStatus === 'success') {
                document.getElementById('main-section').style.display = 'none';
                document.getElementById('confirmation-section').style.display = 'block';
                
                const detailsStr = localStorage.getItem('webinar_student_details');
                const details = detailsStr ? JSON.parse(detailsStr) : {};
                document.getElementById('confirm-name').textContent = details.fullName || 'Student';
                return;
            }

            const registrationForm = document.getElementById('registration-form');
            
            registrationForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const submitBtn = document.getElementById('submit-btn');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Preparing Payment...';

                const studentDetails = {
                    full_name: document.getElementById('full_name').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    whatsapp: document.getElementById('whatsapp').value.trim(),
                    subject_id: "webinar_reg_99" // ID defined in SUBJECT_PRODUCTS
                };
                
                localStorage.setItem('webinar_student_details', JSON.stringify({ fullName: studentDetails.full_name }));

                try {
                    // Production URL injection logic usually handles cross-origin, or proxy on the actual server.
                    // For explicit alignment during build, we point directly to the API endpoint
                    const response = await fetch('/api/v1/payment/create-guest-order', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(studentDetails)
                    });

                    if (!response.ok) {
                        throw new Error('Payment initialization failed');
                    }

                    const data = await response.json();
                    
                    if (data.payment_link) {
                        window.location.href = data.payment_link;
                    } else if (data.payment_session_id) {
                        window.location.href = 'https://payments.cashfree.com/forms/' + data.payment_session_id;
                    } else if (data.payment_url) {
                        window.location.href = data.payment_url;
                    } else {
                        window.location.href = '?payment_status=success';
                    }
                } catch (error) {
                    alert('Error preparing payment: ' + error.message);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Pay ₹99 & Register';
                }
            });
        });
    </script>
</body>
</html>
