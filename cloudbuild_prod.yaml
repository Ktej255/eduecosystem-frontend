steps:
  # 1. Build Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', '-t', '$_GCP_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/backend:latest', 
      '-f', 'backend/Dockerfile.production', 'backend/'
    ]

  # 2. Push Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_GCP_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/backend:latest']

  # 3. Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'eduecosystem-backend'
      - '--image=$_GCP_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/backend:latest'
      - '--region=$_GCP_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=$_CLOUDSQL_INSTANCE'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,DATABASE_URL=$_DATABASE_URL,SECRET_KEY=$_SECRET_KEY'

  # 4. Build Frontend Image (Injecting Backend URL)
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', '-t', '$_GCP_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/frontend:latest', 
      '-f', 'frontend/Dockerfile', 
      '--build-arg', 'NEXT_PUBLIC_API_URL=$_BACKEND_URL', 
      'frontend/'
    ]

  # 5. Push Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_GCP_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/frontend:latest']

  # 6. Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'eduecosystem-frontend'
      - '--image=$_GCP_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/frontend:latest'
      - '--region=$_GCP_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'

substitutions:
  _GCP_REGION: 'us-central1'
  _REPO_NAME: 'eduecosystem-repo'
  _CLOUDSQL_INSTANCE: 'eduecosystem-prod:us-central1:eduecosystem-db'
  _DATABASE_URL: 'postgresql://postgres:Tej%401106@/eduecosystem_prod?host=/cloudsql/eduecosystem-prod:us-central1:eduecosystem-db'
  _BACKEND_URL: 'https://eduecosystem-backend-503001969959.us-central1.run.app/api/v1'
  _SECRET_KEY: 'eduecosystem-gcp-secret-2026-final'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8' # Faster builds for complex Next.js app
