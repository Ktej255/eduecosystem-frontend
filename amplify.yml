version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || nvm install 22
        - cd frontend && npm ci
    build:
      commands:
        - cd frontend
        - echo "NEXT_PUBLIC_API_URL=https://a7z4kjysmp.us-east-1.awsapprunner.com" >> .env.production
        - echo "NEXT_PUBLIC_ENVIRONMENT=production" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: frontend/.next/standalone
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
      - frontend/.next/cache/**/*
